name: APK bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Der Runner bringt das Android SDK mit; hier werden nur Lizenzen
      # bestaetigt und die benoetigten Pakete nachgezogen.
      - name: Android SDK vorbereiten
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          shopt -s nullglob
          candidates=("$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager)
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "Kein sdkmanager unter $SDK_ROOT gefunden" >&2
            exit 1
          fi
          SDKMANAGER="${candidates[0]}"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Release-APK bauen
        run: ./gradlew assembleRelease --stacktrace

      - name: APKs einsammeln
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/luncher-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/luncher-release-${GITHUB_SHA::7}.apk"
          ls -lh artifacts

      - name: APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: luncher-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Bei einem Tag v* landet die APK zusaetzlich in einem Release,
      # damit sie sich direkt vom Handy herunterladen laesst.
      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Luncher ${GITHUB_REF_NAME}" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA}." \
            --latest
